name: Shader Binary Release

# a v* tag builds and publishes a release; a manual run only builds (artifacts to test)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shader_config:
          - group: "media"
            features: ""
            gstreamer_required: true
            shaders: "bugberman,audiovis,fft,pathtracing,pinscreen,fluid,cnn,synth,blockgame,kuwahara,gaussian,tameimp"
          - group: "no-media"
            features: "--no-default-features"
            gstreamer_required: false
            shaders: "blackhole,buddhabrot,lich,mandelbulb,orbits,nebula,rorschach,volumepassage,jfa,gaussian3d,physarum,galaxy,meshlab,tree"
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: ".tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: ".zip"
          # macos-latest is Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: ".tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS' && matrix.shader_config.gstreamer_required
        run: |
          GSTREAMER_VERSION="1.28.6"
          curl -L "https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION/gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" -o gstreamer.pkg
          curl -L "https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION/gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" -o gstreamer-devel.pkg
          sudo installer -pkg gstreamer.pkg -target /
          sudo installer -pkg gstreamer-devel.pkg -target /
          echo "PKG_CONFIG_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig" >> $GITHUB_ENV
          echo "GST_PLUGIN_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/gstreamer-1.0" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib" >> $GITHUB_ENV

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.shader_config.gstreamer_required
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libudev-dev pkg-config build-essential libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            patchelf

      - name: Install Windows dependencies
        if: runner.os == 'Windows' && matrix.shader_config.gstreamer_required
        shell: pwsh
        run: |
          $gstVer = "1.28.6"
          $tempDir = "C:\gst-temp"
          $installDir = "C:\gstreamer"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          # 1.28+ ships one Inno Setup installer (no separate devel package)
          Invoke-WebRequest -Uri "https://github.com/altunenes/cuneus/releases/download/dependencies/gstreamer-1.0-msvc-x86_64-$gstVer.exe" -OutFile "$tempDir\gstreamer.exe"
          $proc = Start-Process -FilePath "$tempDir\gstreamer.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Write-Host "GStreamer install failed: $($proc.ExitCode)"; exit 1 }

          $root = @("$installDir\1.0\msvc_x86_64", "$installDir\msvc_x86_64", $installDir,
                    "C:\Program Files\GStreamer\1.0\msvc_x86_64") | Where-Object { Test-Path "$_\bin\gstreamer-1.0-0.dll" } | Select-Object -First 1
          if ($null -eq $root) { Write-Host "GStreamer not found"; exit 1 }
          Write-Host "GStreamer at $root"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GST_PLUGIN_PATH=$root\lib\gstreamer-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$root\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build binaries
        shell: bash
        run: |
          # room in the Mach-O headers for install_name_tool
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-headerpad_max_install_names"
          fi
          IFS=',' read -ra SHADERS <<< "${{ matrix.shader_config.shaders }}"
          for shader in "${SHADERS[@]}"; do
            cargo build --release --example "$shader" ${{ matrix.shader_config.features }}
          done

      # one GStreamer bundle: lib/ (core libs), lib/gstreamer-1.0/ (plugins), libexec/ (plugin scanner), etc/ (certs)
      - name: Bundle GStreamer
        if: matrix.shader_config.gstreamer_required
        shell: bash
        run: |
          B="gstreamer_bundle"
          mkdir -p "$B/lib/gstreamer-1.0" "$B/libexec/gstreamer-1.0" "$B/etc/ssl/certs"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ROOT="/Library/Frameworks/GStreamer.framework/Versions/1.0"
            SCANNER="gst-plugin-scanner"
            CORE_LIBS=(
              "libgstreamer-1.0.0.dylib" "libgstbase-1.0.0.dylib" "libgstapp-1.0.0.dylib"
              "libgstvideo-1.0.0.dylib" "libgstaudio-1.0.0.dylib" "libgstpbutils-1.0.0.dylib"
              "libgsttag-1.0.0.dylib" "libgstfft-1.0.0.dylib" "libgstgl-1.0.0.dylib"
              "libgstvulkan-1.0.0.dylib" "libgstcodecparsers-1.0.0.dylib" "libgstriff-1.0.0.dylib"
              "libgstrtp-1.0.0.dylib" "libglib-2.0.0.dylib" "libgobject-2.0.0.dylib"
              "libgio-2.0.0.dylib" "libgmodule-2.0.0.dylib" "libintl.8.dylib" "libffi.7.dylib"
              "libpcre2-8.0.dylib" "liborc-0.4.0.dylib" "libz.1.dylib" "libbz2.1.dylib"
              "libavformat.61.dylib" "libavutil.59.dylib" "libavcodec.61.dylib"
              "libavfilter.10.dylib" "libswresample.5.dylib" "libswscale.8.dylib"
              "libSoundTouch.2.dylib" "libMoltenVK.dylib"
            )
            PLUGINS=(
              "libgstcoreelements.dylib" "libgstapp.dylib" "libgstplayback.dylib"
              "libgsttypefindfunctions.dylib" "libgstvideoconvertscale.dylib" "libgstvideorate.dylib"
              "libgstaudioconvert.dylib" "libgstaudioresample.dylib" "libgstvolume.dylib"
              "libgstosxaudio.dylib" "libgstautodetect.dylib" "libgstaudiotestsrc.dylib"
              "libgstaudiomixer.dylib" "libgstspectrum.dylib" "libgstlevel.dylib" "libgstsoundtouch.dylib"
              "libgstaudioparsers.dylib" "libgstwavparse.dylib" "libgstid3demux.dylib"
              "libgstlibav.dylib" "libgstisomp4.dylib"
              "libgstapplemedia.dylib" "libgstvideoparsersbad.dylib"
            )
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            ROOT="${GSTREAMER_1_0_ROOT_MSVC_X86_64}"
            SCANNER="gst-plugin-scanner.exe"
            CORE_LIBS=(
              "gstreamer-1.0-0.dll" "gstbase-1.0-0.dll" "gstapp-1.0-0.dll"
              "gstvideo-1.0-0.dll" "gstaudio-1.0-0.dll" "gstpbutils-1.0-0.dll"
              "gsttag-1.0-0.dll" "gstfft-1.0-0.dll" "gstgl-1.0-0.dll"
              "gstvulkan-1.0-0.dll" "gstcodecparsers-1.0-0.dll" "gstriff-1.0-0.dll"
              "gstrtp-1.0-0.dll" "gstrtsp-1.0-0.dll" "gstsdp-1.0-0.dll"
              "gstnet-1.0-0.dll" "gstcontroller-1.0-0.dll"
              "glib-2.0-0.dll" "gobject-2.0-0.dll" "gio-2.0-0.dll"
              "gmodule-2.0-0.dll" "gthread-2.0-0.dll"
              "intl-8.dll" "ffi-7.dll" "pcre2-8-0.dll"
              "orc-0.4-0.dll" "z.dll" "z-1.dll" "bz2.dll"
              "libwinpthread-1.dll" "libgcc_s_seh-1.dll" "libstdc++-6.dll"
              "libiconv-2.dll" "libcharset-1.dll"
              "avformat-61.dll" "avcodec-61.dll" "avutil-59.dll"
              "avfilter-10.dll" "swresample-5.dll" "swscale-8.dll"
              "opus-0.dll" "vorbis-0.dll" "ogg-0.dll"
              "mp3lame-0.dll" "libmpg123-1.dll"
            )
            PLUGINS=(
              "gstcoreelements.dll" "gstapp.dll" "gstplayback.dll"
              "gsttypefindfunctions.dll" "gstvideoconvertscale.dll" "gstvideorate.dll"
              "gstaudioconvert.dll" "gstaudioresample.dll" "gstvolume.dll"
              "gstvideofilter.dll" "gstgio.dll" "gstlibav.dll"
              "gstwasapi.dll" "gstwasapi2.dll" "gstdirectsound.dll"
              "gstautodetect.dll" "gstaudiotestsrc.dll"
              "gstaudiomixer.dll" "gstspectrum.dll" "gstlevel.dll" "gstsoundtouch.dll"
              "gstaudioparsers.dll"
              "gstisomp4.dll" "gstvideoparsersbad.dll" "gstmatroska.dll"
              "gstavi.dll" "gstflv.dll" "gstmpegtsdemux.dll" "gstasf.dll"
              "gstwavparse.dll" "gstid3demux.dll"
              "gstvpx.dll" "gsttheora.dll" "gstmpg123.dll" "gstlame.dll"
              "gstvorbis.dll" "gstogg.dll"
              "gstdirectshow.dll" "gstwinks.dll"
            )
          else
            ROOT="/usr"
            SCANNER="gst-plugin-scanner"
            CORE_LIBS=(
              "libgstreamer-1.0.so.0" "libgstbase-1.0.so.0" "libgstapp-1.0.so.0"
              "libgstvideo-1.0.so.0" "libgstaudio-1.0.so.0" "libgstpbutils-1.0.so.0"
              "libgsttag-1.0.so.0" "libgstfft-1.0.so.0" "libgstgl-1.0.so.0"
              "libgstvulkan-1.0.so.0" "libgstcodecparsers-1.0.so.0" "libgstriff-1.0.so.0"
              "libgstrtp-1.0.so.0" "libglib-2.0.so.0" "libgobject-2.0.so.0"
              "libgio-2.0.so.0" "libgmodule-2.0.so.0" "liborc-0.4.so.0"
            )
            PLUGINS=(
              "libgstcoreelements.so" "libgstapp.so" "libgstplayback.so"
              "libgsttypefindfunctions.so" "libgstvideoconvert.so" "libgstvideorate.so"
              "libgstaudioconvert.so" "libgstaudioresample.so" "libgstvolume.so"
              "libgstpulseaudio.so" "libgstautodetect.so" "libgstaudiotestsrc.so"
              "libgstaudiomixer.so" "libgstspectrum.so" "libgstlevel.so" "libgstsoundtouch.so"
              "libgstaudioparsers.so" "libgstwavparse.so" "libgstid3demux.so"
              "libgstlibav.so" "libgstisomp4.so"
              "libgstvideoparsersbad.so" "libgstv4l2.so"
            )
            # Debian/Ubuntu keep them under the multiarch dir
            if [[ -d "/usr/lib/x86_64-linux-gnu/gstreamer-1.0" ]]; then ROOT_LIB="/usr/lib/x86_64-linux-gnu"; fi
          fi
          ROOT_LIB="${ROOT_LIB:-$ROOT/lib}"

          for lib in "${CORE_LIBS[@]}"; do
            for d in "$ROOT_LIB" "$ROOT/lib" "$ROOT/bin"; do
              if [[ -f "$d/$lib" ]]; then cp "$d/$lib" "$B/lib/"; break; fi
            done
            [[ -f "$B/lib/$lib" ]] || echo "missing lib: $lib"
          done
          for plugin in "${PLUGINS[@]}"; do
            if [[ -f "$ROOT_LIB/gstreamer-1.0/$plugin" ]]; then
              cp "$ROOT_LIB/gstreamer-1.0/$plugin" "$B/lib/gstreamer-1.0/"
            else
              echo "missing plugin: $plugin"
            fi
          done
          for d in "$ROOT/libexec/gstreamer-1.0" "$ROOT_LIB/gstreamer1.0/gstreamer-1.0" "$ROOT/bin"; do
            if [[ -f "$d/$SCANNER" ]]; then cp "$d/$SCANNER" "$B/libexec/gstreamer-1.0/"; chmod +x "$B/libexec/gstreamer-1.0/$SCANNER"; break; fi
          done
          for c in "$ROOT/etc/ssl/certs/ca-certificates.crt" "/etc/ssl/certs/ca-certificates.crt"; do
            if [[ -f "$c" ]]; then cp "$c" "$B/etc/ssl/certs/"; break; fi
          done
          # framework copies are read-only: install_name_tool and codesign need to write them
          chmod -R u+w "$B"
          echo "GStreamer bundle: $(du -sh $B | cut -f1)"

      - name: Install rcedit
        if: runner.os == 'Windows'
        shell: bash
        run: curl -sL -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe

      # one folder per app: the app, README.txt and the shader's source
      #   Windows: name.exe (+ GStreamer DLLs, lib/, libexec/, etc/)
      #   Linux:   name (+ gstreamer/)
      #   macOS:   name.app (GStreamer inside Contents/Resources/gstreamer)
      - name: Package apps
        shell: bash
        run: |
          MEDIA="${{ matrix.shader_config.gstreamer_required }}"
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0"
          IFS=',' read -ra SHADERS <<< "${{ matrix.shader_config.shaders }}"
          for shader in "${SHADERS[@]}"; do
            OUT="release/$shader"
            mkdir -p "$OUT"
            cp "examples/shaders/$shader.wgsl" "$OUT/"

            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cp "target/release/examples/$shader.exe" "$OUT/"
              ./rcedit.exe "$OUT/$shader.exe" --set-icon assets/icon.ico
              if [[ "$MEDIA" == "true" ]]; then
                cp gstreamer_bundle/lib/*.dll "$OUT/"
                mkdir -p "$OUT/lib"
                cp -r gstreamer_bundle/lib/gstreamer-1.0 "$OUT/lib/"
                cp -r gstreamer_bundle/libexec gstreamer_bundle/etc "$OUT/"
              fi

            elif [[ "${{ runner.os }}" == "Linux" ]]; then
              cp "target/release/examples/$shader" "$OUT/"
              if [[ "$MEDIA" == "true" ]]; then
                cp -r gstreamer_bundle "$OUT/gstreamer"
                patchelf --set-rpath '$ORIGIN/gstreamer/lib' "$OUT/$shader"
                for f in "$OUT"/gstreamer/lib/*.so*; do patchelf --set-rpath '$ORIGIN' "$f" || true; done
                for f in "$OUT"/gstreamer/lib/gstreamer-1.0/*.so; do patchelf --set-rpath '$ORIGIN/..' "$f" || true; done
                patchelf --set-rpath '$ORIGIN/../../lib' "$OUT/gstreamer/libexec/gstreamer-1.0/gst-plugin-scanner" || true
              fi

            else
              APP="$OUT/$shader.app/Contents"
              mkdir -p "$APP/MacOS" "$APP/Resources"
              cp "target/release/examples/$shader" "$APP/MacOS/"
              cp assets/icon.icns "$APP/Resources/icon.icns"
              cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$shader</string>
            <key>CFBundleExecutable</key><string>$shader</string>
            <key>CFBundleIdentifier</key><string>io.github.altunenes.cuneus.$shader</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSCameraUsageDescription</key><string>Webcam input for the shader.</string>
            <key>NSMicrophoneUsageDescription</key><string>Audio input for the shader.</string>
          </dict>
          </plist>
          EOF
              if [[ "$MEDIA" == "true" ]]; then
                G="$APP/Resources/gstreamer"
                cp -r gstreamer_bundle "$G"
                rebase() {
                  otool -L "$1" | awk 'NR>1 {print $1}' | { grep -E "^(@rpath|/Library/Frameworks/GStreamer.framework)" || true; } | while read -r dep; do
                    install_name_tool -change "$dep" "$2/$(basename "$dep")" "$1" 2>/dev/null || true
                  done
                }
                rebase "$APP/MacOS/$shader" "@executable_path/../Resources/gstreamer/lib"
                for f in "$G"/lib/*.dylib; do
                  install_name_tool -id "@loader_path/$(basename "$f")" "$f" 2>/dev/null || true
                  rebase "$f" "@loader_path"
                done
                for f in "$G"/lib/gstreamer-1.0/*.dylib; do rebase "$f" "@loader_path/.."; done
                if [[ -f "$G/libexec/gstreamer-1.0/gst-plugin-scanner" ]]; then
                  rebase "$G/libexec/gstreamer-1.0/gst-plugin-scanner" "@loader_path/../../lib"
                fi
              fi
              # install_name_tool breaks signatures and Apple Silicon kills unsigned code: re-sign ad hoc, inside out
              find "$OUT/$shader.app" -type f \( -name '*.dylib' -o -name 'gst-plugin-scanner' \) -exec codesign --force -s - {} \;
              codesign --force -s - "$OUT/$shader.app"
              codesign --verify --deep --strict "$OUT/$shader.app"
            fi

            R="$OUT/README.txt"
            {
              echo "$shader, made with cuneus: https://github.com/altunenes/cuneus"
              echo ""
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                echo "Run: double-click $shader.exe"
                if [[ "$MEDIA" == "true" ]]; then echo "Keep the DLLs and the lib, libexec and etc folders next to it."; fi
                echo "Missing DLL errors: install https://aka.ms/vs/17/release/vc_redist.x64.exe"
              elif [[ "${{ runner.os }}" == "Linux" ]]; then
                echo "Run: ./$shader"
                if [[ "$MEDIA" == "true" ]]; then echo "Keep the gstreamer folder next to it."; fi
              else
                echo "Run: open $shader.app"
                echo "macOS blocks apps downloaded outside the App Store. Once, in this folder:"
                echo "  xattr -dr com.apple.quarantine $shader.app"
              fi
              echo ""
              echo "$shader.wgsl is the shader's source; the app doesn't need it."
              echo "Exports go to an export folder (your home folder when started from Finder)."
              echo "Questions or bugs: https://github.com/altunenes/cuneus/issues"
            } > "$R"
          done

      - name: Create archives
        shell: bash
        run: |
          cd release
          IFS=',' read -ra SHADERS <<< "${{ matrix.shader_config.shaders }}"
          for shader in "${SHADERS[@]}"; do
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              7z a "../$shader-${{ matrix.target }}${{ matrix.archive_ext }}" "$shader"
            else
              tar -czf "../$shader-${{ matrix.target }}${{ matrix.archive_ext }}" "$shader"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shader_config.group }}-${{ matrix.target }}
          path: "*-${{ matrix.target }}${{ matrix.archive_ext }}"

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
